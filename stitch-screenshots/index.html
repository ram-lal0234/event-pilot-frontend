<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EventFlow Pro — Stitch Screens</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    header {
      padding: 2rem;
      border-bottom: 1px solid #334155;
    }
    h1 { margin: 0 0 0.5rem; font-size: 1.75rem; }
    p { margin: 0; color: #94a3b8; }
    main {
      display: grid;
      gap: 2rem;
      padding: 2rem;
      max-width: 1400px;
      margin: 0 auto;
    }
    figure {
      margin: 0;
      background: #1e293b;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #334155;
    }
    figcaption {
      padding: 1rem 1.25rem;
      font-weight: 600;
      font-size: 1.1rem;
      border-bottom: 1px solid #334155;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      background: #fff;
    }
    a { color: #60a5fa; }
  </style>
</head>
<body>
  <header>
    <h1>EventFlow Pro — Stitch project screens</h1>
    <p>
      Project:
      <a href="https://stitch.withgoogle.com/projects/16429585134276712727">16429585134276712727</a>
      · Fetched via Stitch MCP API
    </p>
  </header>
  <main>
    <figure>
      <figcaption>Login Screens — EventPilot AI</figcaption>
      <p style="padding:1rem;color:#94a3b8">
        Open <a href="login/index.html">login/index.html</a> for Login, Verify OTP, and Mobile Login screenshots plus generated HTML code.
      </p>
    </figure>
    <figure>
      <figcaption>1. Check-In Screen</figcaption>
      <img src="check-in-screen.png" alt="Check-In Screen" />
    </figure>
    <figure>
      <figcaption>2. Dashboard Redesign</figcaption>
      <img src="dashboard-redesign.png" alt="Dashboard Redesign" />
    </figure>
    <figure>
      <figcaption>3. Operations Hub</figcaption>
      <img src="operations-hub.png" alt="Operations Hub" />
    </figure>
    <figure>
      <figcaption>4. Guest Management Redesign</figcaption>
      <img src="guest-management-redesign.png" alt="Guest Management Redesign" />
    </figure>
    <figure>
      <figcaption>5. EventFlow Pro Management Suite (rendered from HTML — no Stitch screenshot asset)</figcaption>
      <img src="eventflow-pro-management-suite.png" alt="EventFlow Pro Management Suite" onerror="this.closest('figure').querySelector('.fallback').style.display='block'; this.style.display='none'" />
      <p class="fallback" style="display:none;padding:1rem;color:#94a3b8">
        Open <a href="eventflow-pro-management-suite.html">eventflow-pro-management-suite.html</a> locally.
      </p>
    </figure>
  </main>
</body>
</html>
